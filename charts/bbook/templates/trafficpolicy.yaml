{{- if and .Values.httpRoute.enabled .Values.httpRoute.allowlist -}}
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: {{ include "bbook.fullname" . }}-allowlist
  labels:
    {{- include "bbook.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "bbook.fullname" . }}
  acl:
    defaultAction: deny
    rules:
      - action: allow
        cidrs:
          {{- toYaml .Values.httpRoute.allowlist | nindent 10 }}
{{- end }}
