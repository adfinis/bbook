{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bbook.fullname" . }}
  labels:
    {{- include "bbook.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hostnames:
    {{- range .Values.httpRoute.hosts }}
    - {{ . | quote }}
    {{- end }}
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  rules:
    - matches:
        {{- with .Values.httpRoute.matches.path }}
        - path:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.httpRoute.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - kind: Service
          name: {{ include "bbook.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
