root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["server"]
  bin = ""
  full_bin = "/bin/bbook"
  pre_cmd = ["sqlc generate && chmod -R a+rw database && npm run build && chmod -R a+rw static/assets"]
  cmd = "go build -o /bin/bbook ."
  delay = 0
  exclude_dir = ["tmp", "node_modules"]
  exclude_file = ["database/db.go", "database/models.go", "database/queries.sql.go"]
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
