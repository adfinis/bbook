<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>bbook</title>
        <link rel="icon" type="image/png" href="/static/adfinis-favicon.png" />
        <script src="https://unpkg.com/htmx.org@2.0.4"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            "brand-sapphire": "#2E4B98",
                            "brand-biscay": "#1C2E5D",
                            "brand-stone": "#0F0F0F",
                            "brand-sunglow": "#FFCA31",
                            "brand-prismarine": "#249087",
                            "brand-anthracite": "#484848",
                            "brand-grey": "#8B8B8C",
                            "brand-neutral": "#F5F6F5",
                        },
                    },
                },
            };
        </script>
    </head>
    <body class="bg-white text-neutral-900 text-sm">
        <header
            class="bg-brand-stone text-white px-3 py-2 flex items-center gap-3"
        >
            <img
                src="/static/adfinis-emblem.png"
                alt="Adfinis"
                class="h-4 w-auto"
            />
            <span class="font-medium">bbook</span>
            <input
                name="q"
                type="search"
                placeholder="search..."
                value="{{ .Query }}"
                autocomplete="off"
                autofocus
                class="flex-1 max-w-md bg-brand-anthracite text-white placeholder-neutral-400 border border-brand-anthracite rounded px-2 py-0.5 text-sm focus:outline-none focus:border-brand-sapphire"
                hx-get="/"
                hx-trigger="input changed delay:200ms, search"
                hx-target="#results"
                hx-select="#results"
                hx-swap="outerHTML"
                hx-push-url="true"
            />

            <span class="text-xs text-neutral-400"
                >{{ len .Contacts }} contacts</span
            >
        </header>

        <table
            id="results"
            class="mx-auto w-full table-fixed border-collapse text-xs"
        >
            <thead
                class="sticky top-0 bg-brand-neutral text-xs uppercase tracking-wide text-brand-anthracite"
            >
                <tr>
                    <th class="text-left px-2 py-1 font-medium">Name</th>
                    <th class="text-left px-2 py-1 font-medium">
                        Organization
                    </th>
                    <th class="text-left px-2 py-1 font-medium">Email</th>
                    <th class="text-left px-2 py-1 font-medium">Phone</th>
                    <th class="text-left px-2 py-1 font-medium">Mobile</th>
                    <th class="text-left px-2 py-1 font-medium">Address</th>
                </tr>
            </thead>
            <tbody>
                {{ range .Contacts }}
                <tr
                    class="odd:bg-white even:bg-neutral-50 hover:bg-brand-neutral align-top"
                >
                    <td class="px-2 py-1 break-words">{{ .Name }}</td>
                    <td class="px-2 py-1 break-words">{{ .Organization }}</td>
                    <td class="px-2 py-1 break-words">{{ .Email }}</td>
                    <td class="px-2 py-1 break-words">{{ .Phone }}</td>
                    <td class="px-2 py-1 break-words">{{ .Mobile }}</td>
                    <td class="px-2 py-1 break-words">{{ .Address }}</td>
                </tr>
                {{ end }}
            </tbody>
        </table>
    </body>
</html>
