variables:
  RUNNER_GENERATE_ARTIFACTS_METADATA: "true"
  SLSA_PROVENANCE_SCHEMA_VERSION: "v1"
  GIT_DEPTH: "0"
  GITLAB_TOKEN: $CI_JOB_TOKEN

stages:
  - history
  - lint
  - test
  - release

include:
  - component: $CI_SERVER_FQDN/components/gitleaks/gitleaks@0.3
    inputs:
      stage: history
      git_depth: 0

  - component: $CI_SERVER_FQDN/components/linting/commitlint/commitlint@0.1
    inputs:
      stage: history

  - component: $CI_SERVER_FQDN/components/go/golangci-lint/golangci-lint@0.1
    inputs:
      stage: lint
      golang_project_root: bbook
      rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

  - component: $CI_SERVER_FQDN/components/go-semantic-release/release@0.1
    inputs:
      stage: release
      git-depth: 0
      rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "release"'

go-test:
  image: golang:1.26@sha256:3c3e25a4da13fd0478eed2df1eb35a0e667094a7124d3993a6a1d30f71c17e79
  stage: test
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.go-mod-cache
  cache:
    key:
      files:
        - bbook/go.sum
    paths:
      - .go-mod-cache
  script:
    - cd bbook
    - go run gotest.tools/gotestsum@v1.13.0 --junitfile ../junit.xml --format testname -- -count=1 ./...
  artifacts:
    when: always
    reports:
      junit: junit.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Shared setup for the real and dry-run goreleaser jobs.
.goreleaser-base:
  image: golang:1.26@sha256:3c3e25a4da13fd0478eed2df1eb35a0e667094a7124d3993a6a1d30f71c17e79
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends docker.io ca-certificates nodejs npm
    - curl -sSfL "https://github.com/goreleaser/goreleaser/releases/download/v2.12.0/goreleaser_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin goreleaser
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.46.0

# build binary + image + sboms on a new release and pushes them
goreleaser:
  extends: .goreleaser-base
  stage: release
  needs: ["semrel-release"]
  script:
    - git fetch --prune --prune-tags
    - |
      if ! git describe --tags --exact-match HEAD >/dev/null 2>&1; then
        echo "No new release was created earlier. Bye"
        exit 0
      fi
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - goreleaser release --clean
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "release"'


goreleaser-dryrun:
  extends: .goreleaser-base
  stage: release
  needs: []
  script:
    - goreleaser release --snapshot --clean
  artifacts:
    paths:
      - dist/
    expire_in: 3 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"'
