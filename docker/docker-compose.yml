name: "bbook-dev"

networks:
  bbook-internal:
    external: false

services:
  bbook-caddy:
    container_name: bbook-caddy
    image: caddy:2.11.6@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - bbook-internal
    cap_add:
      - NET_ADMIN
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/Caddy/caddy_data:/data
      - ./data/Caddy/caddy_config:/config
      - /etc/timezone:/etc/timezone
      - /etc/localtime:/etc/localtime
    env_file:
      - .env

  bbook:
    container_name: bbook
    build:
      context: ../bbook
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    networks:
      - bbook-internal
    # Install JS deps then run air.
    command: ["sh", "-c", "[ -x node_modules/.bin/esbuild ] || npm ci; air"]
    volumes:
      - ../bbook:/app
      - /app/node_modules
      - /etc/timezone:/etc/timezone
      - /etc/localtime:/etc/localtime
    env_file:
      - .env
      - .db.env
      - .backend.env
    depends_on:
      bbook-db:
        condition: service_healthy
      bbook-keycloak:
        condition: service_healthy

  bbook-db:
    container_name: bbook-db
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    networks:
      - bbook-internal
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres/:/var/lib/postgresql/
      - /etc/timezone:/etc/timezone
      - /etc/localtime:/etc/localtime
    env_file:
      - .db.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  bbook-keycloak:
    container_name: bbook-keycloak
    image: quay.io/keycloak/keycloak:26.8@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    networks:
      - bbook-internal
    ports:
      - "8090:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8090
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -en 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - ./keycloak/realm-bbook.json:/opt/keycloak/data/import/realm-bbook.json:ro
      - /etc/timezone:/etc/timezone
      - /etc/localtime:/etc/localtime
